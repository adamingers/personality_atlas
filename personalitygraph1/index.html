<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personality Semantic Atlas — Cooked &amp; Harvested</title>
<style>
html,body{margin:0;height:100%;font-family:Georgia,serif;background:#fbfaf7;color:#22304a}
#top{padding:10px 16px 8px;border-bottom:1px solid #e2ddd2;background:#fbfaf7}
#top h1{font-size:19px;margin:0 0 6px;font-weight:600}
#switch{display:inline-flex;border:1px solid #b9b1a2;border-radius:8px;overflow:hidden;vertical-align:middle}
#switch button{font-family:Georgia,serif;font-size:14px;padding:6px 16px;border:none;background:#fff;color:#22304a;cursor:pointer}
#switch button.on{background:#22304a;color:#fbfaf7}
#desc{font-size:13.5px;color:#5a5346;margin:8px 0 0;max-width:1000px;line-height:1.45}
#desc b{color:#22304a}
#frame{position:absolute;top:var(--th,118px);left:0;right:0;bottom:0}
iframe{width:100%;height:100%;border:none;display:block}
@media(max-width:640px){#top h1{font-size:16px}#desc{font-size:12.5px}}
</style></head><body>
<div id="top">
 <h1>Personality Semantic Atlas <span id="switch"><button id="bC" class="on">Cooked</button><button id="bH">Harvested</button></span></h1>
 <p id="desc"></p>
</div>
<div id="frame"><iframe id="chart" src="cooked.html" title="Personality atlas chart"></iframe></div>
<script>
const DESC={
 C:'<b>Cooked</b> — the same 779 trait-profiles <b>forced onto a designed structure</b>: six family squares built from the four classical humors (Sanguine, Choleric, Phlegmatic, Melancholic) plus Competence and Mystical, with hand-chosen, empirically tested axes inside each square and transition zones between them. Structure is imposed; positions within it are earned from the data.',
 H:'<b>Harvested</b> — the same 779 trait-profiles with <b>no imposed structure at all</b>. Each trait\u2019s adjective profile was embedded (PPMI over the trait\u00d7adjective graph \u2192 120-dimensional SVD), then projected to 2-D with <b>UMAP</b> \u2014 a neighbor-preserving projection \u2014 and rigidly rotated so the axes align (\u224883%) with the corpus\u2019s two strongest meaning dimensions. Distance means dissimilarity; communities, axis words, and valley lines are all derived from the data itself.'};
const desc=document.getElementById('desc'),fr=document.getElementById('chart');
const bC=document.getElementById('bC'),bH=document.getElementById('bH');
function show(which){
 bC.classList.toggle('on',which==='C');bH.classList.toggle('on',which==='H');
 desc.innerHTML=DESC[which];
 fr.src=which==='C'?'cooked.html':'harvested.html';
 try{history.replaceState(null,'','#'+(which==='C'?'cooked':'harvested'));}catch(e){}
 requestAnimationFrame(fit);
}
function fit(){document.getElementById('frame').style.top=document.getElementById('top').offsetHeight+'px';}
bC.addEventListener('click',()=>show('C'));bH.addEventListener('click',()=>show('H'));
window.addEventListener('resize',fit);
show(location.hash==='#harvested'?'H':'C');
</script></body></html>
